version: '1.0'
namespace: chestor.graph.security
entries:
- name: member_access
  kind: security.policy
  groups: []
  policy:
    resources:
    - chestor.graph.traits:*
    - chestor.graph:renderer_view
    actions: access
    effect: allow
- name: member_discovery
  kind: security.policy
  groups: []
  policy:
    resources:
    - chestor.graph:*
    - chestor.graph.*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    comment: Application role with access to the component reading surface and endpoints.
  targets:
  - entry: chestor.graph.security:member_access
    path: .groups +=
  - entry: chestor.graph.security:member_discovery
    path: .groups +=
  - entry: chestor.graph.security:module_access
    path: .groups +=
