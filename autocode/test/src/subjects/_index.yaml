version: "1.0"
namespace: app

entries:
  - name: runner_stubs
    kind: library.lua
    source: file://../runner_stubs.lua
    modules: [time]

  - name: stub_component
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_deferred
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_docker
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_drivers
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_execution_identity
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_funcs
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_live
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_repo
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_runs
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_settings
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: resume_subject
    kind: library.lua
    source: file://../resume_subject.lua
    modules: [security]
    imports:
      funcs: app:stub_funcs
      repo: app:stub_repo

  - name: image_subject
    kind: library.lua
    source: file://../image_subject.lua
    imports:
      repo: app:stub_repo
      drivers: app:stub_drivers
      docker: app:stub_docker
      execution_identity: app:stub_execution_identity
      component: app:stub_component
      transport: app:stub_transport
      job_outcome: chestor.autocode.runner:job_outcome

  - name: run_subject
    kind: library.lua
    source: file://../run_subject.lua
    modules: [logger]
    imports:
      repo: app:stub_repo
      runs: app:stub_runs
      container: chestor.autocode.runner:container
      records: chestor.autocode.runner:records
      redact: chestor.autocode.runner:redact
      docker: app:stub_docker
      live: app:stub_live
      run_io: app:run_io_subject
      execution_identity: app:stub_execution_identity
      deferred: app:stub_deferred
      transport: app:stub_transport
      job_outcome: chestor.autocode.runner:job_outcome

  - name: stub_transport
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: docker_subject
    kind: library.lua
    source: file://../docker_subject.lua
    modules: [stream]
    imports:
      registry: app:stub_registry
      exec: app:stub_exec
      quote: chestor.autocode.runner:quote

  - name: stub_exec
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: workspaces_subject
    kind: library.lua
    source: file://../workspaces_subject.lua
    imports:
      registry: app:stub_registry

  - name: stub_registry
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: owner_subject
    kind: library.lua
    source: file://../owner_subject.lua
    modules: [security]
    imports:
      repo: app:stub_repo
      runs: app:stub_runs
      resources: app:stub_resources
      transport: chestor.autocode.runner:transport
      credentials: chestor.autocode.runner:credentials
      drivers: app:stub_drivers

  - name: stub_resources
    kind: library.lua
    source: file://../stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: retention_subject
    kind: library.lua
    source: file://../retention_subject.lua
    modules: [time]
    imports:
      repo: app:stub_repo
      settings: app:stub_settings

  - name: image_requests_subject
    kind: library.lua
    source: file://../image_requests_subject.lua
    modules: [security, uuid, logger]
    imports:
      repo: app:stub_repo
      deferred: app:stub_deferred
      drivers: app:stub_drivers
      values: chestor.autocode.service:values

  - name: image_management_subject
    kind: library.lua
    source: file://../image_management_subject.lua
    imports:
      repo: app:stub_repo
      resources: app:stub_resources
      images: app:image_requests_subject
      projections: chestor.autocode.service:projections
      values: chestor.autocode.service:values
      boundary: chestor.autocode.service:boundary
      docker: app:stub_docker

  - name: tasks_subject
    kind: library.lua
    source: file://../tasks_subject.lua
    modules: [security, ctx, registry]
    imports:
      boundary: chestor.autocode.service:boundary
      values: chestor.autocode.service:values
      resources: app:stub_resources
      drivers: app:stub_drivers
      credentials: chestor.autocode.runner:credentials
      runs: app:stub_runs
      repo: app:stub_repo
      accounts: chestor.autocode.service:accounts
      projections: chestor.autocode.service:projections

  - name: run_io_subject
    kind: library.lua
    source: file://../run_io_subject.lua
    modules: [time]
    imports:
      repo: app:stub_repo
      runs: app:stub_runs
      records: chestor.autocode.runner:records
      drivers: app:stub_drivers
      redact: chestor.autocode.runner:redact
      docker: app:stub_docker
      settings: app:stub_settings
      transport: app:stub_transport
