    source: file://../../accounts_subject.lua
    modules: [security, logger, json]
    imports:
      boundary: chestor.autocode.service:boundary
      values: chestor.autocode.service:values
      repo: app:stub_repo
      resources: app:stub_resources
      drivers: app:stub_drivers
      credentials: chestor.autocode.domain:credentials
      runs: app:stub_runs
      live: app:stub_live

  - name: stub_context
    kind: library.lua
    source: 'return require("stubs").context'
    imports:
      stubs: app:runner_stubs

  - name: docker_image_subject
    kind: library.lua
    source: file://../../docker_image_subject.lua
    imports:
      docker: app:stub_docker

  - name: maintenance_subject_runner
