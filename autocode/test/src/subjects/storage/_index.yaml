      repo: chestor.autocode.persist:repo

  - name: real_probe_maintenance_subject_runner
    kind: library.lua
    source: file://../../maintenance_runner_subject.lua
    imports:
      worktrees: app:stub_worktrees
      docker: app:probe_docker
      repo: app:stub_repo

  - name: delivery_builds_subject
    kind: library.lua
    source: file://../../builds_subject.lua
    modules: [sql, json, time]
    imports:
      trace: kickside.execution:trace
      recipe: chestor.autocode.domain:recipe
      database: chestor.autocode.persist:database
      jobs: app:delivery_jobs
      settings: chestor.autocode.domain:settings

  - name: arm_subject
    kind: library.lua
    source: file://../../arm_subject.lua
    modules: [json, security]
    imports:
      client: chestor.autocode.service:client
      boundary: chestor.autocode.service:boundary
      trace: kickside.execution:trace
