version: "1.0"
namespace: app.bound
entries:

  - name: trait
    kind: registry.entry
    meta:
      type: agent.trait
      context_schema:
        type: object
        additionalProperties: false
        required: [count]
        properties: {count: {type: integer}}
    tools: [app.bound:tool_a]
    build_func_id: app.bound:build

  - name: build
    kind: function.lua
    source: file://../../gateway_probe.lua
    method: bound_build
    modules: [security, ctx]

  - name: tool_a
    kind: function.lua
    meta: {type: tool, public: true, llm_alias: bound_a, input_schema: {type: object}}
