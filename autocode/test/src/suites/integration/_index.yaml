      stubs: app:runner_stubs
      maintenance: app:maintenance_retention_subject
      builds_subject: app:builds_subject
      run_store_subject: app:run_store_subject
      resource_dto: chestor.autocode.service:resource_dto
      identity: app:identity
      account_health: chestor.autocode.runner:account_health
      redact: chestor.autocode.runner:redact
    security:
      actor: {id: app:test_runner}
      policies: [app:test_runtime]

