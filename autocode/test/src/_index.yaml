# SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0
version: "1.0"
namespace: app

# Standalone harness for chestor/autocode. It supplies the host resources and
# groups a Kickside host supplies: app:db, app:processes, app:gateway with the
# authenticated app:api router and the public login router, env storage, the
# signed-in, administrator and autocode member groups, and the platform modules
# autocode runs on, resolved from the Hub. test/.wippy.yaml replaces
# chestor/autocode with the local checkout.

entries:
  - name: definition
    kind: ns.definition
    meta: { title: Autocode Test Harness }

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    file: ./.wippy/autocode-test.db

  - name: env_storage
    kind: env.storage.file
    meta: { type: envstorage }
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle: { auto_start: true }

  - name: gateway
    kind: http.service
    addr: ":19347"
    lifecycle: { auto_start: true }

  - name: api
    kind: http.router
    meta: { server: gateway }
    prefix: /api
    middleware: [token_auth]
    post_middleware: [endpoint_firewall]
    options:
      token_store: kickside.users.security:tokens

  - name: api.public
    kind: http.router
    meta: { server: gateway }
    prefix: /api/public

  - name: mock
    kind: http.router
    meta: { server: gateway }
    prefix: /mock

  - name: anthropic
    kind: library.lua
    source: file://anthropic.lua
    modules: [http, json]

  - name: anthropic_messages
    kind: http.endpoint
    meta: { router: mock }
    method: POST
    path: /v1/messages
    func: anthropic_messages_handler

  - name: anthropic_messages_handler
    kind: function.lua
    source: file://anthropic.lua
    method: messages
    modules: [http, json]

  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: dep.wippy.bootloader
    kind: ns.dependency
    component: wippy/bootloader
    version: "*"
    parameters:
      - { name: wippy.bootloader:application_host, value: app:processes }
      - { name: wippy.bootloader:env_storage, value: app:env_storage }

  - name: dep.wippy.migration
    kind: ns.dependency
    component: wippy/migration
    version: "*"
    parameters:
      - { name: wippy.migration:app_db, value: app:db }

  - name: dep.kickside.contract
    kind: ns.dependency
    component: kickside/contract
    version: "*"

  - name: dep.kickside.component
    kind: ns.dependency
    component: kickside/component
    version: "*"
    parameters:
      - { name: kickside.component:target_db, value: app:db }
      - { name: kickside.component:api_router, value: app:api }
      - { name: kickside.component:lifecycle_impl, value: kickside.core.lifecycle:component_lifecycle_impl }

  - name: dep.kickside.core
    kind: ns.dependency
    component: kickside/core
    version: "*"
    parameters:
      - { name: kickside.core:target_db, value: app:db }
      - { name: kickside.core.lifecycle:process_host, value: app:processes }
      - name: kickside.core.lifecycle:user_lifecycle_grant
        value: { subject_id: app.security:user, subject_type: group, access_mask: 2 }
      - name: kickside.core.lifecycle:admin_lifecycle_grant
        value: { subject_id: app.security:admin, subject_type: group, access_mask: 3 }
      - { name: kickside.core.projections:api_router, value: app:api }
      - { name: kickside.core.retention:api_router, value: app:api }
      - { name: kickside.core.retention:process_host, value: app:processes }
      - { name: kickside.core.threads:api_router, value: app:api }
      - { name: kickside.core.threads:process_host, value: app:processes }

  - name: dep.kickside.jobs
    kind: ns.dependency
    component: kickside/jobs
    version: "*"
    parameters:
      - { name: kickside.core.jobs:target_db, value: app:db }
      - { name: kickside.core.jobs:process_host, value: app:processes }

  - name: dep.kickside.execution
    kind: ns.dependency
    component: kickside/execution
    version: "*"

  - name: dep.kickside.users
    kind: ns.dependency
    component: kickside/users
    version: "*"
    parameters:
      - { name: kickside.users:env_storage, value: app:env_storage }
      - { name: kickside.users:public_router, value: app:api.public }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:ui_server, value: app:gateway }
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:user_security_scope, value: app.security:user }
      - { name: kickside.users:admin_security_scope, value: app.security:admin }
      - { name: kickside.users:login_role_resource, value: "app.security:*" }

  - name: dep.kickside.security
    kind: ns.dependency
    component: kickside/security
    version: "*"
    parameters:
      - { name: kickside.security:api_router, value: app:api }
      - { name: kickside.security:ui_server, value: app:gateway }
      - { name: kickside.security:target_db, value: app:db }
      - { name: kickside.security:process_host, value: app:processes }

  - name: dep.kickside.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
    parameters:
      - { name: kickside.settings:target_db, value: app:db }
      - { name: kickside.settings:api_router, value: app:api }
      - { name: kickside.settings:ui_server, value: app:gateway }

  - name: dep.kickside.blocks
    kind: ns.dependency
    component: kickside/blocks
    version: "*"
    parameters:
      - { name: kickside.blocks:process_host, value: app:processes }

  - name: dep.wippy.session
    kind: ns.dependency
    component: wippy/session
    version: "*"
    parameters:
      - { name: wippy.session:api_router, value: app:api }
      - { name: wippy.session:env_storage, value: app:env_storage }

  - name: dep.wippy.views
    kind: ns.dependency
    component: wippy/views
    version: "*"
    parameters:
      - { name: wippy.views:api_router, value: app:api }
      - { name: wippy.views:env_storage, value: app:env_storage }

  - name: dep.bee.drivers
    kind: ns.dependency
    component: bee/drivers
    version: "*"
    parameters:
      - { name: bee.drivers:activation, value: chestor.autocode.drivers:activation }
      - { name: bee.drivers:host_environment, value: app:driver_host_environment }
      - { name: bee.drivers:entered_values, value: app:driver_entered_values }
      - { name: bee.drivers:access_scope, value: kickside.security.groups:members }

  - name: dep.chestor.autocode
    kind: ns.dependency
    component: chestor/autocode
    version: "*"
    parameters:
      - { name: chestor.autocode:target_db, value: app:db }
      - { name: chestor.autocode:api_router, value: app:api }
      - { name: chestor.autocode:ui_server, value: app:gateway }
      - { name: chestor.autocode:workspace_roots, value: /srv/autocode-harness }

  - name: test_runtime
    kind: security.policy
    meta:
      comment: Authority of the suite runner, which creates users, reads app:db and the registry, and validates session tokens.
    policy: { resources: "*", actions: "*", effect: allow }

  - name: admin
    namespace: app.security
    kind: security.policy
    meta:
      comment: Administrators hold every action, as the host administrator group does.
    groups: [app.security:admin]
    policy: { resources: "*", actions: "*", effect: allow }

  - name: autocode_managers
    kind: registry.entry
    meta: {type: kickside.security.group_composition}
    group_id: app:autocode_managers
    policies: [chestor.autocode.security:module_management]

  - name: workspace_management
    kind: security.policy
    groups: [app:workspace_managers]
    policy:
      resources: [chestor.autocode.api:workspaces_create.endpoint, chestor.autocode.api:workspaces_delete.endpoint]
      actions: access
      effect: allow

  - name: user.runtime_data_access
    namespace: app.security
    kind: security.policy
    meta:
      comment: Signed-in users open the application database behind module endpoints, as the Kickside host grants app.security:user.
    groups: [app.security:user]
    policy: { resources: app:db, actions: db.get, effect: allow }

  - name: user.runtime_contracts
    namespace: app.security
    kind: security.policy
    meta:
      comment: Signed-in users keep their actor and scope through contract and function calls, as the Kickside host grants app.security:user.
    groups: [app.security:user]
    policy: { resources: security, actions: [contract.security, funcs.security], effect: allow }

  - name: user.unrestricted_runtime_actions
    namespace: app.security
    kind: security.policy
    meta:
      comment: Signed-in users call contract methods; the contract opens and the component service gate the call, as the Kickside host grants app.security:user.
    groups: [app.security:user]
    policy: { resources: "*", actions: contract.call, effect: allow }

  - name: identity
    kind: library.lua
    meta:
      comment: Creates member, outsider and administrator users with real sessions; calls functions and HTTP endpoints as them.
    source: file://identity.lua
    modules: [security, funcs, http_client, json, registry, uuid]
    imports:
      user_repo: kickside.users.persist:user_repo
      user_groups_repo: kickside.users.persist:user_groups_repo
      user_lifecycle_repo: kickside.users.persist:user_lifecycle_repo

  - name: session_probe
    kind: function.lua
    meta:
      comment: Reports the actor id and whether the call's scope grants access to an endpoint.
    source: file://session_probe.lua
    method: run
    modules: [security]

  - name: fixture_register
    kind: function.lua
    meta:
      comment: Registers an autocode component as the calling user.
    source: file://fixture.lua
    method: register
    imports:
      resources: chestor.autocode.components:resources
      runs: chestor.autocode.runner:runs
      repo: chestor.autocode.persist:repo

  - name: fixture_cleanup
    kind: function.lua
    source: file://boundary_probe.lua
    method: cleanup
    modules: [contract]
    imports:
      resources: chestor.autocode.components:resources

  - name: fixture_admit
    kind: function.lua
    meta:
      comment: Admits a run request as the calling user and reports what admission chose.
    source: file://fixture.lua
    method: admit
    imports:
      resources: chestor.autocode.components:resources
      runs: chestor.autocode.runner:runs
      repo: chestor.autocode.persist:repo

  - name: fixture_prune
    kind: function.lua
    meta:
      comment: Prunes runs that settled before a moment.
    source: file://fixture.lua
    method: prune
    imports:
      resources: chestor.autocode.components:resources
      runs: chestor.autocode.runner:runs
      repo: chestor.autocode.persist:repo

  - name: wiring_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_wiring
      group: Autocode
      comment: autocode migrations are applied and every endpoint of its module access policy is registered.
    source: file://suites/wiring_test.lua
    method: run
    modules: [registry, sql]
    imports:
      test: wippy.test:test
    security:
      actor: { id: app:test_runner }
      policies: [app:test_runtime]

  - name: access_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_access
      group: Autocode
      comment: The endpoint firewall admits members, refuses outsiders, and keeps management endpoints to administrators.
    source: file://suites/access_test.lua
    method: run
    imports:
      test: wippy.test:test
      identity: app:identity
    security:
      actor: { id: app:test_runner }
      policies: [app:test_runtime]

  - name: redaction_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_redaction
      group: Autocode
      comment: The run redactor removes a supplied secret and the forms it declares.
    source: file://suites/redaction_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      redact: chestor.autocode.runner:redact

  - name: components_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_components
      group: Autocode
      comment: Accounts are components - private credentials, owner and group grants, personal subscription logins.
    source: file://suites/components_test.lua
    method: run
    imports:
      test: wippy.test:test
      identity: app:identity
    security:
      actor: { id: app:test_runner }
      policies: [app:test_runtime]

  - name: admission_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_admission
      group: Autocode
      comment: Run admission follows the caller's grants on accounts, images and workspaces, and balances across usable accounts.
    source: file://suites/admission_test.lua
    method: run
    imports:
      test: wippy.test:test
      identity: app:identity
    security:
      actor: { id: app:test_runner }
      policies: [app:test_runtime]

  - name: runs_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_runs
      group: Autocode
      comment: Submitted runs keep complete streamed answers, settle under the owner, stay the owner's, and retention prunes them.
    source: file://suites/runs_test.lua
    method: run
    modules: [time, funcs, registry]
    imports:
      test: wippy.test:test
      identity: app:identity
      anthropic: app:anthropic
      docker: chestor.autocode.runner:docker
    security:
      actor: { id: app:test_runner }
      policies: [app:test_runtime]

  - name: records_test
    kind: function.lua
    meta:
      type: test
      suite: autocode_records
      group: Autocode
      comment: Run records retain the final streamed answer separately from clipped log events.
    source: file://suites/records_test.lua
    method: run
    imports:
      test: wippy.test:test
      records: chestor.autocode.runner:records
      redact: chestor.autocode.runner:redact

  # Harness-owned host_environment
  - name: driver_host_environment
    kind: env.storage.file
    meta:
      comment: Host variables the drivers read inside a run's container; the KickSide process environment stays out
    file_path: ./.wippy/test-driver-host.env
    auto_create: true
    file_mode: 384
    lifecycle:
      auto_start: true

  # Harness-owned entered_values
  - name: driver_entered_values
    kind: env.storage.file
    meta:
      comment: Credential values the drivers' credential sources read; autocode delivers account credentials per run instead
    file_path: ./.wippy/test-driver-entered.env
    auto_create: true
    file_mode: 384
    lifecycle:
      auto_start: true

  - name: persistence_test
    kind: function.lua
    meta: {type: test, suite: autocode_persistence, group: Autocode}
    source: file://suites/persistence_test.lua
    method: run
    modules: [sql, uuid]
    imports:
      test: wippy.test:test
      repo: chestor.autocode.persist:repo
    security:
      actor: {id: app:test_runner}
      policies: [app:test_runtime]

  - name: runner_stubs
    kind: library.lua
    source: file://runner_stubs.lua
    modules: [time]

  # Distinct alias IDs keep each subject's dependency edges unique.
  - name: stub_component
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_deferred
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_docker
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_drivers
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_execution_identity
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_funcs
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_live
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_repo
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_runs
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: stub_settings
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: resume_subject
    kind: library.lua
    source: file://resume_subject.lua
    imports:
      funcs: app:stub_funcs
      repo: app:stub_repo

  - name: image_subject
    kind: library.lua
    source: file://image_subject.lua
    imports:
      repo: app:stub_repo
      drivers: app:stub_drivers
      docker: app:stub_docker
      execution_identity: app:stub_execution_identity
      component: app:stub_component
      transport: app:stub_transport
      job_outcome: chestor.autocode.runner:job_outcome

  - name: run_subject
    kind: library.lua
    source: file://run_subject.lua
    modules: [logger, time]
    imports:
      repo: app:stub_repo
      runs: app:stub_runs
      container: chestor.autocode.runner:container
      drivers: app:stub_drivers
      records: chestor.autocode.runner:records
      redact: chestor.autocode.runner:redact
      docker: app:stub_docker
      live: app:stub_live
      settings: app:stub_settings
      execution_identity: app:stub_execution_identity
      deferred: app:stub_deferred
      transport: app:stub_transport
      job_outcome: chestor.autocode.runner:job_outcome

  - name: runner_faults_test
    kind: function.lua
    meta: {type: test, suite: autocode_runner_faults, group: Autocode}
    source: file://suites/runner_faults_test.lua
    method: run
    imports:
      test: wippy.test:test
      stubs: app:runner_stubs
      resume_subject: app:resume_subject
      image_subject: app:image_subject
      run_subject: app:run_subject
    security:
      actor: {id: app:test_runner}
      policies: [app:test_runtime]

  - name: stub_transport
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: docker_subject
    kind: library.lua
    source: file://docker_subject.lua
    modules: [stream]
    imports:
      exec: app:stub_exec
      quote: chestor.autocode.runner:quote

  - name: stub_exec
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: docker_test
    kind: function.lua
    meta: {type: test, suite: autocode_docker, group: Autocode}
    source: file://suites/docker_test.lua
    modules: [registry]
    method: run
    imports:
      test: wippy.test:test
      docker_subject: app:docker_subject
      stubs: app:runner_stubs

  - name: workspaces_subject
    kind: library.lua
    source: file://workspaces_subject.lua
    imports:
      registry: app:stub_registry

  - name: stub_registry
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: workspaces_test
    kind: function.lua
    meta: {type: test, suite: autocode_workspace_roots, group: Autocode}
    source: file://suites/workspaces_test.lua
    method: run
    imports:
      test: wippy.test:test
      subject: app:workspaces_subject
      stubs: app:runner_stubs

  - name: owner_subject
    kind: library.lua
    source: file://owner_subject.lua
    modules: [security]
    imports:
      repo: app:stub_repo
      runs: app:stub_runs
      resources: app:stub_resources
      transport: chestor.autocode.runner:transport
      credentials: chestor.autocode.runner:credentials
      drivers: app:stub_drivers

  - name: stub_resources
    kind: library.lua
    source: file://stub_alias.lua
    imports:
      stubs: app:runner_stubs

  - name: credential_refresh_test
    kind: function.lua
    meta: {type: test, suite: autocode_credential_refresh, group: Autocode}
    source: file://suites/credential_refresh_test.lua
    method: run
    imports:
      test: wippy.test:test
      subject: app:owner_subject
      stubs: app:runner_stubs
    security:
      actor: {id: app:test_runner}
      policies: [app:test_runtime]

  - name: retention_subject
    kind: library.lua
    source: file://retention_subject.lua
    modules: [time]
    imports:
      repo: app:stub_repo
      settings: app:stub_settings

  - name: retention_test
    kind: function.lua
    meta: {type: test, suite: autocode_retention, group: Autocode}
    source: file://suites/retention_test.lua
    modules: [time]
    method: run
    imports:
      test: wippy.test:test
      subject: app:retention_subject
      stubs: app:runner_stubs
