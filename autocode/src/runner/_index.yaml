version: "1.0"
namespace: chestor.autocode.runner

entries:
  - name: redact
    kind: library.lua
    meta:
      comment: Removes credentials from run text before it is stored.
    source: file://redact.lua
    modules:
      - json

  - name: records
    kind: library.lua
    meta:
      comment: Folds bee/drivers reader steps into clipped run events and a bounded final answer.
    source: file://records.lua
    imports:
      credentials: chestor.autocode.domain:credentials
      drivers: bee.drivers:drivers

  - name: run_io
    kind: library.lua
    source: file://run_io.lua
    modules: [time]
    imports:
      credentials: chestor.autocode.domain:credentials
      runs: chestor.autocode.service:runs
      records: chestor.autocode.runner:records
      drivers: bee.drivers:drivers
      redact: chestor.autocode.runner:redact
      docker: chestor.autocode.infrastructure:docker
      transport: chestor.autocode.service:transport

  - name: account_health
    kind: library.lua
    source: file://account_health.lua
    modules: [time]
    imports:
      repo: chestor.autocode.persist:repo
      drivers: bee.drivers:drivers
      redact: chestor.autocode.runner:redact
      settings: chestor.autocode.domain:settings
