version: "1.0"
namespace: chestor.autocode

entries:
  # chestor.autocode:definition
  - name: definition
    kind: ns.definition
    meta:
      title: Autocode
      description: Run coding agent CLIs in Docker images across accounts, as a page and as a workflow Block, with streamed task output.

  # chestor.autocode:dep.bee.drivers
  - version: "*"
    name: dep.bee.drivers
    kind: ns.dependency
    meta:
      comment: Declarative agent CLI drivers and the drivers library; the host binds activation to chestor.autocode.drivers:activation and supplies its own environment storages.
    component: bee/drivers

  # chestor.autocode:dep.kickside.contract
  - version: "*"
    name: dep.kickside.contract
    kind: ns.dependency
    meta:
      comment: Kickside contracts; runs notify their owner through kickside.contract:realtime.
    component: kickside/contract

  # chestor.autocode:dep.kickside.component
  - version: "*"
    name: dep.kickside.component
    kind: ns.dependency
    meta:
      comment: Component service - accounts, images and workspaces are component kinds with grants and teardown.
    component: kickside/component

  # chestor.autocode:dep.kickside.jobs
  - version: "*"
    name: dep.kickside.jobs
    kind: ns.dependency
    meta:
      comment: Durable jobs - each run, image build and workflow resume is a job committed with its rows.
    component: kickside/jobs

  # chestor.autocode:dep.kickside.execution
  - version: "*"
    name: dep.kickside.execution
    kind: ns.dependency
    meta:
      comment: Execution identity - a run and an image build record who started them; the workers resolve it live.
    component: kickside/execution

  # chestor.autocode:dep.kickside.settings
  - version: "*"
    name: dep.kickside.settings
    kind: ns.dependency
    meta:
      comment: Admin settings for the run timeout, the account cooldown and run retention.
    component: kickside/settings

  # chestor.autocode:dep.kickside.blocks
  - version: "*"
    name: dep.kickside.blocks
    kind: ns.dependency
    meta:
      comment: Typed Block composition, durable parking and Signal resume for the coding agent task Block.
    component: kickside/blocks

  # chestor.autocode:dep.wippy.migration
  - version: "*"
    name: dep.wippy.migration
    kind: ns.dependency
    meta:
      comment: Migration framework for the account state, image build, run, and run event tables.
    component: wippy/migration

  # ─── Dependency interface (ns.requirement) ───────────────────────────
  - name: target_db
    kind: ns.requirement
    meta:
      value_kind: db.sql
      comment: Database resource for the autocode tables; it is the jobs database, so rows and their jobs commit together.
    targets:
      - entry: chestor.autocode.migrations:02_delivery_and_generations
        path: .meta.target_db
      - entry: chestor.autocode.migrations:01_create_tables
        path: .meta.target_db
      - entry: chestor.autocode.persist:db_config
        path: .meta.db_id
      - entry: chestor.autocode.security:store
        path: .policy.resources +=

  - name: api_router
    kind: ns.requirement
    meta:
      value_kind: http.router
      comment: Authenticated HTTP router the autocode endpoints attach to.
    targets:
      - entry: chestor.autocode.api:catalog.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:drivers_list.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:accounts_list.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:accounts_create.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:accounts_update.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:accounts_delete.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_list.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_get.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_create.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_update.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_delete.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:images_prepare.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:workspaces_list.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:workspaces_create.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:workspaces_delete.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:runs_list.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:runs_create.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:runs_get.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:runs_cancel.user.endpoint
        path: .meta.router
      - entry: chestor.autocode.api:maintenance_prune.endpoint
        path: .meta.router

  - name: ui_server
    kind: ns.requirement
    meta:
      value_kind: http.service
      comment: HTTP server the autocode UI bundle is served from.
    targets:
      - entry: chestor.autocode:ui_static
        path: .meta.server

  - name: workspace_roots
    kind: ns.requirement
    default: ""
    meta:
      comment: Comma-separated absolute host directories under which workspaces may be registered and bind-mounted - the operator's ceiling on what administrators register. Empty admits none.
    targets:
      - entry: chestor.autocode:runtime_config
        path: .meta.workspace_roots

  # chestor.autocode:runtime_config
  - name: runtime_config
    kind: registry.entry
    meta:
      comment: Holds the workspace roots; the workspace_roots requirement rewrites meta.workspace_roots.

  - name: docker_path
    kind: ns.requirement
    default: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    meta:
      comment: Host executable search path for the Docker executor; override when Docker is installed elsewhere.
    targets:
      - entry: chestor.autocode:docker
        path: .default_env.PATH

  # chestor.autocode:docker
  - name: docker
    kind: exec.native
    meta:
      comment: Host executor for the docker CLI. Commands are argv lines; secrets travel only in the per-command environment.

  # ─── UI ──────────────────────────────────────────────────────────────
  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built autocode web component bundle (from ui/).
    directory: ./static
    auto_init: true

  - name: ui_static
    kind: http.static
    meta:
      comment: Serves the autocode web component bundle at /chestor-autocode.
    path: /chestor-autocode
    fs: chestor.autocode:ui_fs
    options:
      mime_types:
        .js: application/javascript
        .css: text/css
        .map: application/json

  - name: autocode_view
    kind: registry.entry
    meta:
      type: view.component
      title: Autocode
      announced: true
      auto_register: true
      tag_name: chestor-autocode
      base_path: chestor-autocode
      entry_point: index.js
      icon: tabler:robot
      description: Starts agent tasks across your agent accounts and streams their output. Subscription logins are for personal use only; use API keys or your own endpoints for production or multiple users.
      props: {}

  # The credential card of one agent driver (chestor-autocode-driver-account), served from
  # the same bundle directory (driver-account.js). A surface that holds agent
  # accounts mounts it by tag, passes {driver, busy, error, saved} as `config`
  # and stores the `submit` it emits.
  - name: driver_account_view
    kind: registry.entry
    meta:
      type: view.component
      title: Agent driver account
      announced: true
      auto_register: false
      tag_name: chestor-autocode-driver-account
      base_path: chestor-autocode
      entry_point: driver-account.js
      description: Credential card of one agent driver - drop or paste a login file or key, an optional own endpoint for API keys, and the personal-use notice for subscription logins.
      props:
        config: {type: object}

  # The config editor of the coding agent task Block (chestor-autocode-task-config),
  # mounted by the workflow builder as the Block's presentation.config_wc.
  - name: task_config_view
    kind: registry.entry
    meta:
      type: view.component
      title: Coding agent task config
      announced: true
      auto_register: false
      tag_name: chestor-autocode-task-config
      base_path: chestor-autocode
      entry_point: task-config.js
      description: Config editor of the coding agent task Block - agent, account or balancing, image, workspace, task and the driver's own options.
      props:
        config: {type: object}

  # The management tab on the System page (chestor-autocode-admin): images,
  # workspaces and Docker maintenance, served from the same bundle (admin.js).
  - name: settings_tab_view
    kind: registry.entry
    meta:
      type: view.component
      title: Autocode management
      announced: true
      auto_register: true
      tag_name: chestor-autocode-admin
      base_path: chestor-autocode
      entry_point: admin.js
      description: Agent images, host workspaces and Docker maintenance for autocode, and who may use each.
      props: {}

  - name: settings_tab
    kind: registry.entry
    meta:
      type: ui.settings_tab
      comment: Autocode images, workspaces and Docker maintenance.
    access: chestor.autocode.api:images_create.endpoint
    key: autocode
    label: Autocode
    icon: tabler:robot
    order: 80
    render: component
    component_tag: chestor-autocode-admin

  # ─── Settings ────────────────────────────────────────────────────────
  - name: setting.run_timeout
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a run's agent CLI may work before the run stops as failed.
    namespace: chestor.autocode
    key: run_timeout
    value_type: duration
    default: 2h
    title: Run timeout
    category: Runs
    order: 10
    description: "How long an agent task may run (a duration such as `30m` or `2h`); the CLI is stopped and the run fails after it."
    scope: global
    editable: true
    visible: true

  - name: setting.account_cooldown
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a retryable provider refusal keeps an account out of balancing.
    namespace: chestor.autocode
    key: account_cooldown
    value_type: duration
    default: 30m
    title: Account cooldown
    category: Runs
    order: 20
    description: "How long an account rests after the provider refuses a run with a retryable fault such as a rate limit (a duration such as `30m`)."
    scope: global
    editable: true
    visible: true

  - name: setting.run_retention
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long settled runs and their event logs are kept.
    namespace: chestor.autocode
    key: run_retention
    value_type: duration
    default: 720h
    title: Run retention
    category: Runs
    order: 30
    description: "How long a settled run and its event log are kept before retention deletes them (a duration such as `720h`)."
    scope: global
    editable: true
    visible: true

  - name: nav_item
    kind: registry.entry
    meta:
      type: ui.nav_item
      section: ""
      path: /autocode
      route_name: autocode
      title: Autocode
      comment: Run coding agents in Docker.
      icon: tabler:robot
      order: 80
      render: component
      component_tag: chestor-autocode
