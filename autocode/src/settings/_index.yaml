version: "1.0"
namespace: chestor.autocode

entries:
  - name: setting.run_timeout
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a run's agent CLI may work before the run stops as failed.
    namespace: chestor.autocode
    key: run_timeout
    value_type: duration
    default: 2h
    title: Run timeout
    category: Time limits
    order: 110
    unit: hours / minutes
    description: "Stop a running task when it reaches this limit. Enter 1m to 168h."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.account_cooldown
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a retryable provider refusal keeps an account out of balancing.
    namespace: chestor.autocode
    key: account_cooldown
    value_type: duration
    default: 30m
    title: Account cooldown
    category: Time limits
    order: 140
    unit: hours / minutes
    description: "Keep an account out of rotation after a retryable provider error, such as a rate limit."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.run_retention
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long settled runs and their event logs are kept.
    namespace: chestor.autocode
    key: run_retention
    value_type: duration
    default: 720h
    confirm_decrease: true
    title: Run and log retention
    category: Retention
    order: 310
    unit: hours / minutes
    description: "Delete finished runs and their logs after this time. Shorter retention can delete existing history."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.build_cache_retention
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long unused Docker build cache is kept on the shared host.
    namespace: chestor.autocode
    key: build_cache_retention
    value_type: duration
    default: 24h
    title: Build cache retention
    category: Retention
    order: 320
    unit: hours / minutes
    description: "Keep unused cache at least this long when you run Docker cleanup."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.image_build_timeout
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long an image build and its probes may run.
    namespace: chestor.autocode
    key: image_build_timeout
    value_type: duration
    default: 30m
    title: Image build timeout
    category: Time limits
    order: 120
    unit: hours / minutes
    description: "Stop building and probing an image when it reaches this limit. Enter 1m to 168h."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: validate_duration
    kind: function.lua
    source: file://validate.lua
    method: validate
    modules: [time]
    imports:
      settings: chestor.autocode.domain:settings

  - name: setting.run_event_count
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: run_event_count
    value_type: int
    default: 4096
    title: Run event count
    category: Sizes
    order: 440
    unit: events
    description: "Maximum number of events kept for one run."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.run_event_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: run_event_bytes
    value_type: int
    default: 8388608
    title: Run event bytes
    category: Sizes
    order: 450
    unit: bytes
    description: "Maximum total space for event names and text in one run."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.workflow_delivery_timeout
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: workflow_delivery_timeout
    value_type: duration
    default: 24h
    title: Workflow delivery window
    category: Time limits
    order: 130
    unit: hours / minutes
    description: "Stop retrying delivery of a finished run to its workflow after this time."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.pending_runs_per_owner
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: pending_runs_per_owner
    value_type: int
    default: 128
    title: Pending runs per owner
    category: Queue
    order: 220
    unit: runs
    description: "Maximum unfinished runs for one owner."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.pending_runs_global
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: pending_runs_global
    value_type: int
    default: 4096
    title: Pending runs globally
    category: Queue
    order: 230
    unit: runs
    description: "Maximum unfinished runs across all owners."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.queue_timeout
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: queue_timeout
    value_type: duration
    default: 24h
    title: Queue expiry window
    category: Queue
    order: 210
    unit: hours / minutes
    description: "Fail a run if it waits this long without starting."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.result_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: result_bytes
    value_type: int
    default: 1048576
    title: Result bytes
    category: Sizes
    order: 410
    unit: bytes
    description: "Maximum text kept in a run result."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.event_text_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: event_text_bytes
    value_type: int
    default: 8000
    title: Event text bytes
    category: Sizes
    order: 430
    unit: bytes
    description: "Maximum text kept from each run event."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.build_log_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: build_log_bytes
    value_type: int
    default: 65536
    title: Build log bytes
    category: Sizes
    order: 420
    unit: bytes
    description: "Maximum text kept from the end of an image build log."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false

  - name: setting.clone_depth
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: clone_depth
    value_type: int
    default: 50
    title: Git clone depth
    category: Sizes
    order: 460
    unit: commits
    description: "Number of commits to fetch in a Git clone. Enter 0 to fetch the full history."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: false
