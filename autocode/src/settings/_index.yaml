version: "1.0"
namespace: chestor.autocode

entries:
  - name: settings.block.autocode
    kind: registry.entry
    meta:
      type: kickside.settings:block
    key: autocode
    title: Autocode
    icon: tabler:robot
    group: Application
    order: 80
    namespace: chestor.autocode

  - name: setting.run_timeout
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a run's agent CLI may work before the run stops as failed.
    namespace: chestor.autocode
    key: run_timeout
    value_type: duration
    default: 2h
    title: Run timeout
    category: Runs
    order: 10
    description: "How long an agent task may run (at least `1m`, at most 7 days / `168h`); the CLI is stopped and the run fails after it."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.account_cooldown
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long a retryable provider refusal keeps an account out of balancing.
    namespace: chestor.autocode
    key: account_cooldown
    value_type: duration
    default: 30m
    title: Account cooldown
    category: Runs
    order: 20
    description: "How long an account rests after the provider refuses a run with a retryable fault such as a rate limit (a duration such as `30m`)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.run_retention
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long settled runs and their event logs are kept.
    namespace: chestor.autocode
    key: run_retention
    value_type: duration
    default: 720h
    title: Run and log retention
    category: Runs
    order: 30
    description: "Retention deletes settled runs and their event logs older than this duration (for example, `720h`)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.build_cache_retention
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long unused Docker build cache is kept on the shared host.
    namespace: chestor.autocode
    key: build_cache_retention
    value_type: duration
    default: 24h
    title: Build cache retention
    category: Images and Docker
    order: 50
    description: "How long unused build cache stays on the shared Docker host before manual cleanup removes it (a duration such as `24h`)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.image_build_timeout
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: How long an image build and its probes may run.
    namespace: chestor.autocode
    key: image_build_timeout
    value_type: duration
    default: 30m
    title: Image build timeout
    category: Images and Docker
    order: 40
    description: "Image build and probe deadline (at least 1m, at most 168h)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: validate_duration
    kind: function.lua
    source: file://validate.lua
    method: validate
    modules: [time]
    imports:
      settings: chestor.autocode.domain:settings

  - name: setting.run_event_count
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: run_event_count
    value_type: int
    default: 4096
    title: Run event count
    category: Runs
    order: 31
    description: "Maximum stored events per run, including the head and one truncation notice (4 to 100000)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.run_event_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: run_event_bytes
    value_type: int
    default: 8388608
    title: Run event bytes
    category: Runs
    order: 32
    description: "Maximum UTF-8 bytes of stored event kinds and text per run (1024 to 1073741824)."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.workflow_delivery_timeout
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: workflow_delivery_timeout
    value_type: duration
    default: 24h
    title: Workflow delivery window
    category: Runs
    order: 33
    description: "How long workflow delivery retries after run settlement; expiry records an outcome and releases normal run retention."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.pending_runs_per_owner
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: pending_runs_per_owner
    value_type: int
    default: 128
    title: Pending runs per owner
    category: Runs
    order: 11
    description: "Maximum unfinished runs admitted for one owner (1 to 100000). Settled runs release capacity."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.pending_runs_global
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: pending_runs_global
    value_type: int
    default: 4096
    title: Pending runs globally
    category: Runs
    order: 12
    description: "Maximum unfinished runs across all owners (1 to 1000000). Matching idempotency replays reuse capacity."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.queue_timeout
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: queue_timeout
    value_type: duration
    default: 24h
    title: Queue expiry window
    category: Runs
    order: 13
    description: "Maximum time a run may remain queued without starting. Expiry purges its inactive Jobs slot and records a failed outcome; an active lease defers expiry until release."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.result_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: result_bytes
    value_type: int
    default: 1048576
    title: Result bytes
    category: Runs
    order: 14
    description: "Maximum UTF-8 bytes in the result head (1024 to 67108864), followed by a truncation notice when needed."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.event_text_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: event_text_bytes
    value_type: int
    default: 8000
    title: Event text bytes
    category: Runs
    order: 15
    description: "Maximum UTF-8 bytes in each event text head (256 to 1048576), followed by a truncation notice. The total run event byte budget also applies."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.build_log_bytes
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: build_log_bytes
    value_type: int
    default: 65536
    title: Build log bytes
    category: Images and Docker
    order: 41
    description: "Maximum retained UTF-8 build log bytes (1024 to 16777216). Keeps a rolling tail of lines; oversized lines keep their head."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true

  - name: setting.clone_depth
    kind: registry.entry
    meta: {type: kickside.settings:definition}
    namespace: chestor.autocode
    key: clone_depth
    value_type: int
    default: 50
    title: Git clone depth
    category: Runs
    order: 16
    description: "Repository clone depth (0 to 1000000); zero clones full history."
    scope: global
    validate_func: chestor.autocode:validate_duration
    editable: true
    visible: true
