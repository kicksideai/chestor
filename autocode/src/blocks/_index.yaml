version: "1.0"
namespace: chestor.autocode.blocks

# Autocode publishes one canonical Block. Workflows, Automations and headless
# Flow builders compose it with kickside.blocks; the visual Workflows plugin is
# one optional consumer of the same typed contract.

entries:
  # chestor.autocode.blocks:block.task
  - name: block.task
    kind: registry.entry
    meta:
      type: kickside.block
      public: true
      title: Coding agent task
      description: Runs a coding agent CLI task in a Docker image on one of your
        accounts, waits safely, and returns its answer.
    data:
      block:
        api_version: kickside.block/v1
        input:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: false
          required: [ prompt ]
          anyOf:
            - required: [ profile_id ]
            - required: [ agent, image_id ]
          properties:
            tools:
              type: object
              properties:
                traits:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  maxItems: 32
                  uniqueItems: true
                tools:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                  maxItems: 128
                  uniqueItems: true
                context:
                  type: object
                  additionalProperties: {}
              additionalProperties: false
            profile_id: { type: string, minLength: 1, maxLength: 64, title: Profile }
            agent: { type: string, minLength: 1, maxLength: 64, title: Agent }
            account_pool:
              {
                type: array,
                maxItems: 200,
                uniqueItems: true,
                items: { type: string, minLength: 1, maxLength: 64 },
                title: Account pool
              }
            endpoint:
              type: object
              properties:
                protocol:
                  type: string
                  maxLength: 64
                base_url:
                  type: string
                  maxLength: 512
                model:
                  type: string
                  maxLength: 200
              required:
                - protocol
                - base_url
              additionalProperties: false
            account_id:
              {
                type: string,
                title: Account,
                description: Empty balances across the agent's available accounts.
              }
            image_id: { type: string, minLength: 1, maxLength: 64, title: Image }
            workspace_id:
              {
                type: string,
                title: Workspace,
                description: Empty works in a scratch directory.
              }
            prompt:
              {
                type: string,
                minLength: 1,
                maxLength: 16384,
                title: Task,
                format: textarea
              }
            include_input: { type: boolean, title: Pass the node input to the agent, default: true }
            unattended: { type: boolean, title: Unattended }
            options: { type: object, title: Driver options, additionalProperties: true }
            repo_url: { type: string, maxLength: 2000, title: Git repository }
            repo_ref: { type: string, maxLength: 200, title: Repository branch or tag }
            run_timeout:
              {
                type: string,
                maxLength: 64,
                title: Run timeout,
                description: A duration of at least one minute; empty uses the configured run
                  timeout.
              }
        output: &task_output
          type: object
          additionalProperties: false
          required: [ run_id, status, answer, error, usage, agent, account_id ]
          properties:
            run_id: { type: string }
            status: { type: string, enum: [ succeeded, failed, cancelled ] }
            answer: { type: string }
            error: { type: string }
            usage:
              type: object
              properties:
                input_tokens:
                  type: number
                  minimum: 0
                output_tokens:
                  type: number
                  minimum: 0
                cached_tokens:
                  type: number
                  minimum: 0
                cache_write_tokens:
                  type: number
                  minimum: 0
                reasoning_tokens:
                  type: number
                  minimum: 0
                cost_usd:
                  type: number
                  minimum: 0
                cost_decimal:
                  type: string
                currency:
                  type: string
                models:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      input_tokens:
                        type: number
                        minimum: 0
                      output_tokens:
                        type: number
                        minimum: 0
                      cached_tokens:
                        type: number
                        minimum: 0
                      cache_write_tokens:
                        type: number
                        minimum: 0
                      reasoning_tokens:
                        type: number
                        minimum: 0
                      cost_usd:
                        type: number
                        minimum: 0
                      cost_decimal:
                        type: string
                      currency:
                        type: string
                    additionalProperties: false
              additionalProperties: false
            agent: { type: string }
            account_id: { type: string }
            error_native:
              type: object
              properties:
                kind:
                  type: string
                message:
                  type: string
                retryable:
                  type: boolean
                details:
                  type: object
                  additionalProperties: {}
              required:
                - kind
                - message
              additionalProperties: false
        error:
          type: object
          required: [ code, message ]
          properties:
            code: { type: string }
            message: { type: string }
        ports:
          - {
              id: then,
              label: Succeeded,
              direction: out,
              condition: "output.status == 'succeeded'",
              schema: *task_output
            }
          - {
              id: else,
              label: Did not succeed,
              direction: out,
              condition: "output.status != 'succeeded'",
              schema: *task_output
            }
          - { id: failed, label: Failed, direction: out }
        presentation:
          category: Agents
          icon: tabler:robot
          hue: violet
          blurb: Runs an activated coding agent on a task, then routes on its answer.
          config_wc: chestor-autocode-task-config
        execution:
          kind: wait
          arm_id: chestor.autocode.blocks:arm_task

  # chestor.autocode.blocks:arm_task
  - name: arm_task
    kind: function.lua
    meta:
      comment: Arm of the agent task Block - submits the run under the Flow's
        identity; the run's settlement enqueues the node's resume.
    source: file://arm.lua
    security:
      policies:
        [
          chestor.autocode.security:flow_context,
          chestor.autocode.security:flow_authorization
        ]
    method: arm
    modules: [ funcs ]
    imports:
      trace: kickside.execution:trace
      client: chestor.autocode.service:client
      boundary: chestor.autocode.service:boundary

  # chestor.autocode.blocks:resume
  - name: resume
    kind: function.lua
    meta:
      comment: Job that continues the workflow node a run started, with the stored
        run's result as the node's output.
    source: file://../service/workflow_resume.lua
    method: run
    modules: [ funcs, security ]
    imports:
      repo: chestor.autocode.persist:repo
      canonical_json: kickside.contract:canonical_json
    security:
      actor:
        id: system:chestor.autocode.resume
      policies:
        - chestor.autocode.security:worker_runtime
        - chestor.autocode.security:store
        - chestor.autocode.security:flow_resume
        - chestor.autocode.security:flow_resume_arm
        - chestor.autocode.security:flow_identity
