version: "1.0"
namespace: chestor.autocode.blocks

# Autocode publishes one canonical Block. Workflows, Automations and headless
# Flow builders compose it with kickside.blocks; the visual Workflows plugin is
# one optional consumer of the same typed contract.

entries:
  # chestor.autocode.blocks:block.task
  - name: block.task
    kind: registry.entry
    meta:
      type: kickside.block
      public: true
      title: Coding agent task
      description: Runs a coding agent CLI task in a Docker image on one of your accounts, waits safely, and returns its answer.
    data:
      block:
        api_version: kickside.block/v1
        input:
          type: object
          additionalProperties: true
        config:
          type: object
          additionalProperties: false
          required: [agent, image_id, prompt]
          properties:
            agent: { type: string, minLength: 1, maxLength: 64, title: Agent }
            account_id: { type: string, title: Account, description: Empty balances across the agent's available accounts. }
            image_id: { type: string, minLength: 1, maxLength: 64, title: Image }
            workspace_id: { type: string, title: Workspace, description: Empty works in a scratch directory. }
            prompt: { type: string, minLength: 1, maxLength: 16384, title: Task, format: textarea }
            include_input: { type: boolean, title: Pass the node input to the agent, default: true }
            unattended: { type: boolean, title: Unattended }
            options: { type: object, title: Driver options, additionalProperties: true }
            repo_url: { type: string, maxLength: 2000, title: Git repository }
            repo_ref: { type: string, maxLength: 200, title: Repository branch or tag }
            run_timeout: { type: string, maxLength: 64, title: Run timeout, description: A duration of at least one minute; empty uses the configured run timeout. }
        output: &task_output
          type: object
          additionalProperties: false
          required: [run_id, status, answer, error, usage, agent, account_id]
          properties:
            run_id: { type: string }
            status: { type: string, enum: [succeeded, failed, cancelled] }
            answer: { type: string }
            error: { type: string }
            usage:
              type: object
              additionalProperties: false
              properties:
                input_tokens: {type: number, minimum: 0}
                output_tokens: {type: number, minimum: 0}
                cached_tokens: {type: number, minimum: 0}
            agent: { type: string }
            account_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        ports:
          - { id: then, label: Succeeded, direction: out, condition: "output.status == 'succeeded'", schema: *task_output }
          - { id: else, label: Did not succeed, direction: out, condition: "output.status != 'succeeded'", schema: *task_output }
          - { id: failed, label: Failed, direction: out }
        presentation:
          category: Agents
          icon: tabler:robot
          hue: violet
          blurb: Runs an activated coding agent on a task, then routes on its answer.
          config_wc: chestor-autocode-task-config
        execution:
          kind: wait
          arm_id: chestor.autocode.blocks:arm_task

  # chestor.autocode.blocks:arm_task
  - name: arm_task
    kind: function.lua
    meta:
      comment: Arm of the agent task Block - submits the run under the Flow's identity; the run's settlement enqueues the node's resume.
    source: file://arm.lua
    security:
      policies: [chestor.autocode.security:flow_context]
    method: arm
    modules: [json, security]
    imports:
      trace: kickside.execution:trace
      client: chestor.autocode.service:client
      boundary: chestor.autocode.service:boundary
      dataflow_repo: userspace.dataflow.persist:dataflow_repo

  # chestor.autocode.blocks:resume
  - name: resume
    kind: function.lua
    meta:
      comment: Job that continues the workflow node a run started, with the stored run's result as the node's output.
    source: file://resume.lua
    method: run
    imports:
      workflow_resume: chestor.autocode.service:workflow_resume
    security:
      actor:
        id: system:chestor.autocode.resume
      policies:
        - chestor.autocode.security:worker_runtime
        - chestor.autocode.security:store
        - chestor.autocode.security:flow_resume
        - chestor.autocode.security:flow_identity
