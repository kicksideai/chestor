version: "1.0"
namespace: chestor.autocode.persist

entries:
  # chestor.autocode.persist:db_config
  - name: db_config
    kind: registry.entry
    meta:
      comment: Holds the database resource ID; the target_db requirement rewrites meta.db_id.

  # chestor.autocode.persist:repo
  - name: repo
    kind: library.lua
    meta:
      comment: Typed account state, image build, run and run event records, decoded at the storage boundary.
    source: file://repo.lua
    imports:
      database: chestor.autocode.persist:database
      accounts: chestor.autocode.persist:accounts
      builds: chestor.autocode.persist:builds
      runs: chestor.autocode.persist:runs
      events: chestor.autocode.persist:events
      workspaces: chestor.autocode.persist:workspaces

  - name: database
    kind: library.lua
    source: file://database.lua
    modules: [sql, json, registry, time]
    imports:
      recipe: chestor.autocode.domain:recipe

  - name: accounts
    kind: library.lua
    source: file://accounts.lua
    modules: [time]
    imports:
      database: chestor.autocode.persist:database

  - name: builds
    kind: library.lua
    source: file://builds.lua
    modules: [sql, json, time]
    imports:
      trace: kickside.execution:trace
      database: chestor.autocode.persist:database
      jobs: kickside.core.jobs:jobs
      recipe: chestor.autocode.domain:recipe
      settings: chestor.autocode.domain:settings
      job_outcome: chestor.autocode.domain:job_outcome

  - name: runs
    kind: library.lua
    source: file://runs.lua
    modules: [sql, uuid]
    imports:
      trace: kickside.execution:trace
      database: chestor.autocode.persist:database
      limits: chestor.autocode.domain:limits
      job_outcome: chestor.autocode.domain:job_outcome
      jobs: kickside.core.jobs:jobs

  - name: events
    kind: library.lua
    source: file://events.lua
    modules: [sql]
    imports:
      settings: chestor.autocode.domain:settings
      database: chestor.autocode.persist:database

  - name: project_account
    kind: function.lua
    source: file://account_state.lua
    modules: [json]
    method: project
    imports:
      repo: chestor.autocode.persist:repo
      component: kickside.component:component
    security:
      actor: {id: system:chestor.autocode.accounts}
      policies:
        - chestor.autocode.security:worker_runtime
        - chestor.autocode.security:worker_calls
        - chestor.autocode.security:service_calls
        - chestor.autocode.security:store
        - chestor.autocode.security:account_status

  - name: retention
    kind: library.lua
    source: file://retention.lua
    modules: [sql]
    imports:
      database: chestor.autocode.persist:database

  - name: workspaces
    kind: library.lua
    source: file://workspaces.lua
    imports:
      database: chestor.autocode.persist:database
