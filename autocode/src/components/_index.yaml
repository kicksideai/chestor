version: "1.0"
namespace: chestor.autocode.components

# Agent profiles, accounts, Docker images and host workspaces are Kickside components:
# owner and group grants decide who sees and uses each one, private context
# holds what a run needs, and deleting one runs the
# module's teardown. All four are standalone kinds listed on the Autocode
# pages, never placed in the workspace tree.

entries:
  # chestor.autocode.components:account
  - name: account
    kind: contract.binding
    meta:
      title: Agent account
      comment: A credential one agent CLI runs with - an API key, optionally for an own endpoint, or a personal subscription login. READ grants let a run use either credential kind.
      icon: tabler:key
      class: [chestor.autocode.account]
      placement:
        parents: [root]
        fixed: true
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: chestor.autocode.components:status
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: chestor.autocode.components:delete_account

  # chestor.autocode.components:image
  - name: image
    kind: contract.binding
    meta:
      title: Agent image
      comment: A Docker image with agent CLIs and its container run settings. READ lets a member run tasks in it.
      icon: tabler:brand-docker
      class: [chestor.autocode.image]
      placement:
        parents: [root]
        fixed: true
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: chestor.autocode.components:status
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: chestor.autocode.components:delete_image

  # chestor.autocode.components:workspace
  - name: workspace
    kind: contract.binding
    meta:
      title: Agent workspace
      comment: A host directory runs mount at /workspace. READ mounts it read-only, WRITE mounts it read-write.
      icon: tabler:folder
      class: [chestor.autocode.workspace]
      placement:
        parents: [root]
        fixed: true
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: chestor.autocode.components:status
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: chestor.autocode.components:delete_workspace

  # chestor.autocode.components:resources
  - name: resources
    kind: library.lua
    meta:
      comment: Typed access to the account, image and workspace components through the component service under the caller.
    source: file://resources.lua
    modules: [json]
    imports:
      component: kickside.component:component
      envelope: kickside.component:envelope
      component_types: kickside.component:types
      recipe: chestor.autocode.domain:recipe

  # chestor.autocode.components:status
  - name: status
    kind: function.lua
    meta:
      comment: Component status of an account, image or workspace - the status its public meta renders.
    source: file://status.lua
    method: status
    modules: [ctx]
    imports:
      component: kickside.component:component

  # chestor.autocode.components:delete_account
  - name: delete_account
    kind: function.lua
    meta:
      comment: Account teardown - removes its balancing state; runs it served keep their history.
    source: file://teardown.lua
    method: delete_account
    modules: [ctx]
    imports:
      repo: chestor.autocode.persist:repo
      image_tags: chestor.autocode.infrastructure:image_tags
      docker_image: chestor.autocode.infrastructure:docker_image
    security:
      policies: [chestor.autocode.security:store]

  # chestor.autocode.components:delete_image
  - name: delete_image
    kind: function.lua
    meta:
      comment: Image teardown drains its build, releases generation tags and applies requested reference removal.
    source: file://teardown.lua
    method: delete_image
    modules: [ctx]
    imports:
      repo: chestor.autocode.persist:repo
      image_tags: chestor.autocode.infrastructure:image_tags
      docker_image: chestor.autocode.infrastructure:docker_image
    security:
      policies: [chestor.autocode.security:store, chestor.autocode.security:docker_commands]

  # chestor.autocode.components:delete_workspace
  - name: delete_workspace
    kind: function.lua
    meta:
      comment: A workspace owns no module rows; its host directory remains in place.
    source: 'return {delete = function() return {success = true} end}'
    method: delete

  - name: profile
    kind: contract.binding
    meta:
      title: Agent profile
      comment: Named harness defaults without credentials. READ permits selection; referenced resources retain their own grants.
      icon: tabler:robot
      class: [chestor.autocode.profile]
      placement:
        parents: [root]
        fixed: true
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: chestor.autocode.components:status
      - contract: kickside.contract:deletable
        methods:
          delete: chestor.autocode.components:delete_profile

  - name: delete_profile
    kind: function.lua
    source: 'return {delete = function() return {success = true} end}'
    method: delete
