version: "1.0"
namespace: chestor.autocode.service

entries:
- name: boundary
  kind: library.lua
  source: file://boundary.lua
  modules:
  - registry
  - json
  - security

- name: values
  kind: library.lua
  source: file://values.lua

- name: client
  kind: library.lua
  source: file://client.lua
  modules:
  - contract
  imports:
    boundary: chestor.autocode.service:boundary

- name: projections
  kind: library.lua
  source: file://projections.lua
  imports:
    repo: chestor.autocode.persist:repo
    resources: chestor.autocode.components:resources

- name: accounts
  kind: library.lua
  source: file://accounts.lua
  modules:
  - security
  - logger
  imports:
    boundary: chestor.autocode.service:boundary
    values: chestor.autocode.service:values
    repo: chestor.autocode.persist:repo
    resources: chestor.autocode.components:resources
    drivers: bee.drivers:drivers
    credentials: chestor.autocode.runner:credentials
    runs: chestor.autocode.runner:runs
    live: chestor.autocode.runner:live

- name: images
  kind: library.lua
  source: file://images.lua
  modules:
  - security
  - uuid
  - logger
  imports:
    values: chestor.autocode.service:values
    repo: chestor.autocode.persist:repo
    drivers: bee.drivers:drivers
    deferred: chestor.autocode.runner:deferred

- name: catalog
  kind: library.lua
  source: file://catalog.lua
  modules:
  - registry
  - security
  imports:
    client: chestor.autocode.service:client
    images: chestor.autocode.service:images
    accounts: chestor.autocode.service:accounts
    boundary: chestor.autocode.service:boundary

- name: add_account
  kind: function.lua
  source: file://account_methods.lua
  method: add_account
  imports:
    accounts: chestor.autocode.service:accounts

- name: update_account
  security:
    policies:
    - chestor.autocode.security:account_notify
  kind: function.lua
  source: file://account_methods.lua
  method: update_account
  imports:
    accounts: chestor.autocode.service:accounts

- name: remove_account
  kind: function.lua
  source: file://account_methods.lua
  method: remove_account
  imports:
    accounts: chestor.autocode.service:accounts

- name: image_management
  kind: library.lua
  source: file://image_management.lua
  imports:
    repo: chestor.autocode.persist:repo
    resources: chestor.autocode.components:resources
    images: chestor.autocode.service:images
    projections: chestor.autocode.service:projections
    values: chestor.autocode.service:values
    boundary: chestor.autocode.service:boundary
    docker: chestor.autocode.runner:docker

- name: workspace_management
  kind: library.lua
  source: file://workspace_management.lua
  modules:
  - security
  imports:
    values: chestor.autocode.service:values
    resources: chestor.autocode.components:resources
    workspaces: chestor.autocode.runner:workspaces
    client: chestor.autocode.service:client
    boundary: chestor.autocode.service:boundary

- name: maintenance
  kind: library.lua
  source: file://maintenance.lua
  imports:
    docker: chestor.autocode.runner:docker
