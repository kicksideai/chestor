version: "1.0"
namespace: chestor.autocode.service

entries:
- name: list_agents
  kind: function.lua
  source: file://../tasks.lua
  method: list_agents
  modules: &task_modules
  - security
  - ctx
  - registry
  imports: &task_imports
    boundary: chestor.autocode.service:boundary
    values: chestor.autocode.service:values
    resources: chestor.autocode.components:resources
    drivers: bee.drivers:drivers
    credentials: chestor.autocode.domain:credentials
    runs: chestor.autocode.service:runs
    repo: chestor.autocode.persist:repo
    accounts: chestor.autocode.service:accounts
    resource_dto: chestor.autocode.service:resource_dto

- name: list_accounts
  kind: function.lua
  source: file://../tasks.lua
  method: list_accounts
  modules: *task_modules
  imports: *task_imports

- name: list_images
  kind: function.lua
  source: file://../tasks.lua
  method: list_images
  modules: *task_modules
  imports: *task_imports

- name: list_workspaces
  kind: function.lua
  source: file://../tasks.lua
  method: list_workspaces
  modules: *task_modules
  imports: *task_imports

- name: submit_task
  kind: function.lua
  source: file://../tasks.lua
  method: submit_task
  modules: *task_modules
  imports: *task_imports

- name: get_run
  kind: function.lua
  source: file://../tasks.lua
  method: get_run
  modules: *task_modules
  imports: *task_imports

- name: list_runs
  kind: function.lua
  source: file://../tasks.lua
  method: list_runs
  modules: *task_modules
  imports: *task_imports

- name: cancel_run
  kind: function.lua
  source: file://../tasks.lua
  method: cancel_run
  modules: *task_modules
  imports: *task_imports
  security:
    policies:
    - chestor.autocode.security:docker_commands
