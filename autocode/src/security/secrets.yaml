version: '1.0'
namespace: chestor.autocode.security
entries:
  - name: account_secret_dispatch
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: funcs.call
      resources: [kickside.component.system:read_runtime_context]
      effect: allow
  - name: account_secret_read
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: component.secrets.read
      resources: [chestor.autocode.components:account]
      effect: allow
