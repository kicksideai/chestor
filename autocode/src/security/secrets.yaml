version: '1.0'
namespace: chestor.autocode.security
entries:
  - name: account_secret_dispatch
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: funcs.call
      resources: [kickside.component.system:read_runtime_context]
      effect: allow
  - name: account_secret_read
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: component.secrets.read
      resources: [chestor.autocode.components:account]
      effect: allow

  - name: codex_oauth
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: http_client.request
      resources:
        - https://auth.openai.com/api/accounts/deviceauth/usercode
        - https://auth.openai.com/api/accounts/deviceauth/token
        - https://auth.openai.com/oauth/token
      effect: allow

  - name: codex_sign_in_store
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: [store.get, store.key.get, store.key.set, store.key.delete]
      resources: [chestor.autocode.drivers:codex_sign_ins]
      effect: allow

  - name: codex_sign_in_lock
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: [process.registry.register.consistent, process.registry.unregister.consistent]
      resources: ["chestor.autocode.codex.device.*"]
      effect: allow

  - name: codex_refresh_lock
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: [process.registry.register.consistent, process.registry.unregister.consistent]
      resources: ["chestor.autocode.codex.refresh.*"]
      effect: allow

  - name: account_check_http
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: http_client.request
      resources:
        - https://api.openai.com/v1/models
        - https://api.anthropic.com/v1/models
        - https://generativelanguage.googleapis.com/v1beta/models
        - https://api.x.ai/v1/models
        - https://api.groq.com/openai/v1/models
        - https://openrouter.ai/api/v1/key
        - https://api.mistral.ai/v1/models
        - https://api.deepseek.com/user/balance
      effect: allow
