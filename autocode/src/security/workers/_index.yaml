version: "1.0"
namespace: chestor.autocode.security

entries:
  - name: store
    kind: security.policy
    meta:
      private: true
      comment: Trusted workers open the autocode database and read the module's host bindings.
    policy:
      resources: []
      actions: [db.get]
      effect: allow

