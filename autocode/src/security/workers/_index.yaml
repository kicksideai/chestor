      actions: [registry.get, registry.find]
      effect: allow

  - name: worker_calls
    kind: security.policy
    meta:
      private: true
      comment: Owner-bound steps, live identity resolution, settings reads, and job wake calls.
    policy:
      resources:
        - kickside.component:notify_access
        - chestor.autocode.persist:project_account
        - chestor.autocode.service:prepare
        - chestor.autocode.service:keep_credential
        - chestor.autocode.service:image_recipe
        - chestor.autocode.service:image_ready
        - kickside.contract:scope_resolver
        - kickside.users:scope_resolver_binding
        - kickside.component:component_service
        - kickside.component.binding:component_service_impl
        - kickside.settings:settings
        - kickside.settings:settings_binding
        - kickside.core.jobs.persist:pool_nudge
        - kickside.mcp:credential_restriction
        - kickside.identity:link_get
        - resolve
        - security
      actions: [funcs.call, funcs.security, contract.get, contract.open, contract.call, contract.security]
      effect: allow

  - name: deferred_runs
    kind: security.policy
    meta:
      private: true
      comment: The runner resolves a run owner's stored execution identity.
    policy:
      resources: chestor.autocode:runs
      actions: kickside.execution.defer
      effect: allow

  - name: deferred_images
    kind: security.policy
    meta:
      private: true
      comment: The image builder resolves the stored execution identity of the administrator who requested a build.
    policy:
      resources: chestor.autocode:images
      actions: kickside.execution.defer
      effect: allow

  - name: deferred_actor
    kind: security.policy
    meta:
      private: true
      comment: Workers reconstruct the live principal actor and policy groups after Users resolution.
    policy:
      resources: "*"
      actions: [security.actor.create, security.policy_group.get, security.policy.get, security.scope.create]
      effect: allow

  - name: docker_commands
    kind: security.policy
    meta:
      private: true
      comment: The only command line the module runs - the docker CLI behind its stderr-merging shell wrapper on the module's executor.
    policy:
      resources:
        - /bin/sh -c 'exec /bin/sh -c "$AUTOCODE_DOCKER_COMMAND" 2>&1'
      actions: [exec.get, exec.run]
      effect: allow

  - name: run_notify
    kind: security.policy
    meta:
      private: true
      comment: The runner tells a run owner's open views that the run changed.
    policy:
      resources: [kickside.contract:realtime, kickside.realtime:realtime_binding, kickside.realtime:notify, notify]
      actions: [contract.get, contract.open, contract.call, realtime.notify]
      effect: allow

  - name: image_status
    kind: security.policy
    meta:
      private: true
      comment: The image builder settles the public status of image components through the trusted runtime meta write.
    policy:
      resources: "*"
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.impl_id
          operator: eq
          value: chestor.autocode.components:image

  - name: flow_resume
    kind: security.policy
    meta:
      private: true
      comment: The resume job continues the workflow node a run started - the Blocks resume call and a Workflow run's resume handler.
    policy:
      actions: [funcs.call, funcs.security, kickside.execution.defer]
      resources: [kickside.blocks:resume, kickside.blocks:resume_under_identity, kickside.workflows.runs:resume, security]
      effect: allow

  - name: flow_identity
    kind: security.policy
    meta:
      private: true
      comment: Blocks resume rebuilds the Flow's stored identity, as the Inbox review resume does.
    policy:
      actions: [security.actor.create, security.policy_group.get]
      resources: "*"
      effect: allow

  - name: account_notify
    kind: security.policy
    meta: {private: true, comment: Account changes publish through the component service's stored READ audience.}
    policy:
      resources: kickside.component:notify_access
      actions: funcs.call
      effect: allow

  - name: flow_context
    kind: security.policy
    meta: {private: true, comment: The Block arm carries the parked callback outside the public task request.}
    policy:
      resources: context
      actions: contract.context
      effect: allow

  - name: account_status
    kind: security.policy
    meta: {private: true, comment: The account state owner publishes its render snapshot.}
    policy:
      resources: "*"
      actions: component.runtime_meta.write
      effect: allow
      conditions:
        - field: meta.impl_id
          operator: eq
          value: chestor.autocode.components:account

  - name: git_commands
    kind: security.policy
    meta: {private: true, comment: Bounded git commands on the operator-selected workspace executor.}
    policy:
      resources:
        - /bin/sh -c 'exec timeout -k 2 30 /bin/sh -c "$AUTOCODE_HOST_COMMAND" 2>&1'
      actions: [exec.get, exec.run]
      effect: allow

  - name: gateway_dispatch
    kind: security.policy
    meta: {private: true, comment: The gateway dispatches only frozen tools under the reconstructed owner actor, scope and context.}
    policy:
      resources: "*"
      actions: [funcs.call, funcs.context]
      effect: allow
