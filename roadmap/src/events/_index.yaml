version: "1.0"
namespace: chestor.roadmap.events

# The published event faces of the roadmap component thread. The binding's
# events.output list names these ids; an automation port resolves its schema
# through the entry, so every declared output type has an entry here.

entries:
  - name: layer.added
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A lane was added to the roadmap.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        sort_order: { type: number }
      required: [id, title]

  - name: layer.updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A lane's presentation or ordering changed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        color: { type: string }
        icon: { type: string }
        sort_order: { type: number }
      required: [id]

  - name: layer.removed
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A lane was removed; refused while any initiative or milestone references it.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
      required: [id]

  - name: outcome.added
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: An outcome — the reason a bet exists — was added.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        sort_order: { type: number }
      required: [id, title]

  - name: outcome.updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: An outcome's title, description, or ordering changed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        sort_order: { type: number }
      required: [id]

  - name: outcome.removed
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: An outcome was removed; refused while any initiative is filed under it.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
      required: [id]

  - name: initiative.added
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A planning unit was placed on a lane.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        layer_id: { type: string }
        outcome_id: { type: string }
        status: { type: string, enum: [idea, planned, active, done, dropped] }
        confidence: { type: string, enum: [low, med, high] }
        size: { type: string, enum: [S, M, L, XL] }
        start_period: { type: string, description: Canonical period key matching settings.period_kind. }
        span: { type: integer, minimum: 1 }
        progress: { type: number, minimum: 0, maximum: 1 }
        owner: { type: string }
        tags: { type: array, items: { type: string } }
        properties: { type: object }
        sort_order: { type: number }
      required: [id, title, layer_id]

  - name: initiative.updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: Any subset of an initiative's fields changed; this is also the move and resize event.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        layer_id: { type: string }
        outcome_id: { type: string }
        status: { type: string, enum: [idea, planned, active, done, dropped] }
        confidence: { type: string, enum: [low, med, high] }
        size: { type: string, enum: [S, M, L, XL] }
        start_period: { type: string }
        span: { type: integer, minimum: 1 }
        progress: { type: number, minimum: 0, maximum: 1 }
        owner: { type: string }
        tags: { type: array, items: { type: string } }
        properties: { type: object }
        sort_order: { type: number }
      required: [id]

  - name: initiative.removed
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: An initiative was removed; refused while a dependency or milestone references it.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
      required: [id]

  - name: dependency.added
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A directed edge was drawn; to_id needs from_id, from_id unlocks to_id.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        from_id: { type: string }
        to_id: { type: string }
        kind: { type: string, enum: [requires, informs] }
        note: { type: string }
      required: [id, from_id, to_id]

  - name: dependency.updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A dependency's kind or note changed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [requires, informs] }
        note: { type: string }
      required: [id]

  - name: dependency.removed
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A dependency edge was removed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
      required: [id]

  - name: milestone.added
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A named point was placed on the period axis.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        period: { type: string, description: Canonical period key matching settings.period_kind. }
        layer_id: { type: string }
        initiative_ids: { type: array, items: { type: string } }
      required: [id, title, period]

  - name: milestone.updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A milestone's title, period, lane, or membership changed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        period: { type: string }
        layer_id: { type: string }
        initiative_ids: { type: array, items: { type: string } }
      required: [id]

  - name: milestone.removed
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: A milestone was removed from the period axis.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id: { type: string }
      required: [id]

  - name: roadmap.settings-updated
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: The roadmap's period kind, origin, visible column count, or default lens changed.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        settings:
          type: object
          properties:
            period_kind: { type: string, enum: [quarter, month] }
            origin: { type: string }
            columns: { type: integer, minimum: 1 }
            default_lens: { type: string, enum: [timeline, horizons, strata, outcomes] }
      required: [settings]

  - name: roadmap.lens-state-set
    kind: registry.entry
    meta:
      type: kickside.core.threads.event
      comment: Per-lens view state; folded into settings and excluded from the undo stack.
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        lens: { type: string, enum: [timeline, horizons, strata, outcomes] }
        state: { type: object }
      required: [lens]
