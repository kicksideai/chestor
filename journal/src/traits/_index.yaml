  - name: query_journal_graph
    kind: function.lua
    source: file://query_journal_graph.lua
    method: handler
    imports: { graph: chestor.journal.graph:service, support: chestor.journal.traits:support }
    meta:
      internal: true
      deprecated: true
      comment: Compatibility adapter retained for existing callers; JournalQuery is the public tool.
      title: Query Journal Graph
      mcp: { required_scopes: [state.read] }
      llm_alias: QueryJournalGraph
      llm_description: List Journal graphs or read a bounded graph window, a complete selected subtree, reusable context packet, complete-if-small workspace bundle with truthful continuations, immutable action timeline, search, evidence page, or revision delta. Lists and searches return compact summary rows with paging. Pass fields for selected content. Node, context, window, subtree and bundle return full detail including bodies, documents, renderer hints, relations and provenance. Follow node/edge continuations for a branch larger than the envelope. Use context with one node_id to resolve its chain, ordered member edges, descendant policy, and refs. Use bundle only for a detached specification/research workspace; when it exceeds the envelope, follow continuations.
      input_schema:
        type: object
        properties:
          fields: { type: array, items: { type: string }, description: "Fields in collection rows; defaults summaries. IDs remain." }
          journal_id: { type: string }
          after_rank: { type: integer, minimum: 0 }
          after_updated_at: { type: integer, minimum: 0 }
          after_graph_id: { type: string }
          lifecycle: { type: string }
          graph_id: { type: string }
          mode: { type: string, enum: [catalog, node, graph_path, path, neighbors, context, window, subtree, bundle, search, semantic, hybrid, timeline, evidence, changes] }
          root_id: { type: string }
          node_id: { type: string }
          detail: { type: string, enum: [compact, full], description: "Accepted for existing callers; collections are summaries, detail reads are complete." }
          direction: { type: string, enum: [both, in, out] }
          edge_kind: { type: string }
          query: { type: string }
          node_kind: { type: string, description: "search: exact generic node kind filter" }
          status: { type: string, description: "search: exact generic node status filter" }
          entity_type: { type: string, enum: [node, edge], description: "timeline: optionally restrict temporal results" }
          from_time: { type: integer, minimum: 0, description: "search/timeline: inclusive updated-at epoch-second lower bound" }
          to_time: { type: integer, minimum: 0, description: "search/timeline: inclusive updated-at epoch-second upper bound" }
          event_id: { type: string }
          target_type: { type: string }
          target_id: { type: string }
          levels: { type: integer, minimum: 1, maximum: 4 }
          depth: { type: integer, minimum: 1, maximum: 64 }
          limit: { type: integer, minimum: 1, maximum: 160 }
          offset: { type: integer, minimum: 0 }
          node_offset: { type: integer, minimum: 0, description: "bundle/subtree node continuation offset" }
          edge_offset: { type: integer, minimum: 0, description: "bundle/subtree edge continuation offset" }
          node_limit: { type: integer, minimum: 1, maximum: 500, description: "bundle/subtree node envelope" }
          edge_limit: { type: integer, minimum: 1, maximum: 1000, description: "bundle/window edge envelope" }
          member_limit: { type: integer, minimum: 1, maximum: 100, description: "context: direct packet-member envelope" }
          path_limit: { type: integer, minimum: 1, maximum: 64, description: "context: root-first chain envelope" }
          since_revision: { type: integer, minimum: 0 }
        required: [journal_id]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          success: { type: boolean }
          result: { type: object, description: "Paged summary items for catalog/search/semantic/hybrid/timeline/evidence/changes. Node, context, window, subtree and bundle are full detail reads. Explicit fields selects collection content." }
        required: [success]

  - name: apply_journal_graph_ops
    kind: function.lua
    source: file://apply_journal_graph_ops.lua
    method: handler
    imports: { graph: chestor.journal.graph:service, support: chestor.journal.traits:support }
    meta:
      internal: true
      deprecated: true
      comment: Compatibility adapter retained for existing callers; JournalGraph(action=apply) is the public tool.
      title: Apply Journal Graph Operations
      mcp: { required_scopes: [state.read, state.write] }
      llm_alias: ApplyJournalGraphOps
      llm_description: Append one attributed and idempotent generic graph node, edge, or layout batch with optimistic revision protection. Node add/update accepts arbitrary attrs plus declarative content, documents, and presentation; these affect rendering and chunked retrieval without creating schema-level document/task node types.
      input_schema:
        type: object
        properties:
          journal_id: { type: string }
          graph_id: { type: string }
          request_id: { type: string }
          expected_revision: { type: integer, minimum: 0 }
          origin: { type: string, enum: [human, external_agent, internal_agent] }
          source_event_ids:
            type: array
            items: { type: string }
          provenance: { type: object }
          operations:
            type: array
            minItems: 1
            maxItems: 200
            description: >-
              node.add/node.update may carry attrs or attrs_patch, content text/object,
              documents array, and presentation renderer hints. Completion/reopening is
              a status update; immutable graph changes retain both actions.
            items: { type: object }
        required: [journal_id, graph_id, request_id, operations]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          success: { type: boolean }
          accepted: { type: boolean }
          journal_id: { type: string }
          max_seq: { type: [integer, "null"] }
        required: [success]

  - name: configure_journal_graph
    kind: function.lua
    source: file://configure_journal_graph.lua
    method: handler
    imports: { graph: chestor.journal.graph:service, support: chestor.journal.traits:support }
    meta:
      internal: true
      deprecated: true
      comment: Compatibility adapter retained for existing callers; JournalGraph(action=create/configure) is the public tool.
      title: Configure Journal Graph
      mcp: { required_scopes: [state.read, state.write] }
      llm_alias: ConfigureJournalGraph
      llm_description: >-
        Create or revise one declarative Journal graph or detached workspace.
        Use kind=automatic for append-first operation: deterministic projection
        records each source immediately, then an optional bounded maintainer
        classifies and organizes semantic structure in batches. The maintainer
        model defaults through KickSide's class:fast selector and remains
        replaceable per graph. A workspace/specification/research/alternatives/
        audit graph may isolate questions, sources, papers, claims, requirements,
        and competing designs; workspace.integration_policy=explicit keeps it
        non-governing until an evidence-backed Journal decision integrates it.
        Includes typed source filters, lifecycle, maintenance thresholds,
        retention, maintainer model/prompt, and optional Wippy traits for that
        internal maintainer.
      input_schema:
        type: object
        properties:
          journal_id: { type: string, minLength: 1 }
          graph_id: { type: string, minLength: 1 }
          request_id: { type: string }
          expected_config_revision: { type: integer, minimum: 0 }
          title: { type: string, minLength: 1 }
          description: { type: string }
          kind:
            type: string
            maxLength: 96
            description: Free-form graph presentation/organization hint; it does not impose a base-domain ontology.
          lifecycle: { type: string, enum: [active, learning, frozen, archived] }
          sources:
            type: object
            properties:
              event_types:
                type: array
                items: { type: string }
              tags:
                type: array
                items: { type: string }
            additionalProperties: false
          shape: { type: object }
          maintainer:
            type: object
            properties:
              mode: { type: string, enum: [deterministic, agent, deterministic+agent] }
              model:
                type: string
                description: KickSide model id or class alias; defaults to class:fast and can be replaced per graph without changing stored history.
              agent_id: { type: string }
              prompt: { type: string }
              trait_ids:
                type: array
                items: { type: string }
                description: Optional Wippy traits activated only for the internal graph maintainer.
              maximum_iterations: { type: integer, minimum: 1, maximum: 20 }
              fallback: { type: boolean }
            additionalProperties: false
          schedule:
            type: object
            properties:
              min_nodes: { type: integer, minimum: 4, maximum: 10000 }
              growth_nodes: { type: integer, minimum: 1, maximum: 10000 }
              max_roots: { type: integer, minimum: 2, maximum: 1000 }
              max_siblings: { type: integer, minimum: 2, maximum: 1000 }
            additionalProperties: false
          retention: { type: object }
          write_policy: { type: object }
          layout: { type: object }
          workspace:
            type: object
            properties:
              detached: { type: boolean, description: "Isolate this workspace from automatic governing/project semantics until explicit integration." }
              parent_graph_id: { type: string, description: "Optional parent graph; ancestry is indexed, cycle-checked, and returned root-first." }
              anchor_graph_id: { type: string, description: "Optional graph containing the node that commissioned this workspace." }
              anchor_node_id: { type: string, description: "Optional generic node that commissioned this workspace, without making workspace claims governing." }
              research_question: { type: string }
              expected_outputs: { type: array, items: { type: string } }
              closure_criteria: { type: array, items: { type: string } }
              integration_policy: { type: string, enum: [explicit], description: "Detached workspaces only integrate through an explicit decision." }
            additionalProperties: false
        required: [journal_id, graph_id, title]
        additionalProperties: false
      output_schema:
        type: object
        properties:
          success: { type: boolean }
          accepted: { type: boolean }
          journal_id: { type: string }
          max_seq: { type: [integer, "null"] }
        required: [success]
