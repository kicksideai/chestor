          accepted: { type: boolean }
          refused: { type: boolean, description: True when a lease-carried fact was refused; code names the enforcement code. }
          code: { type: string }
          detail: { type: string }
          journal_id: { type: string }
          max_seq: { type: [integer, "null"] }
          event_id: { type: string }
          task_id: { type: string, description: The task the fact attached to (explicit, lease-resolved, or the active default). }
          context_pack: { type: object }
          receipt: { type: object }
