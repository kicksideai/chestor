version: "1.0"
namespace: chestor.journal.api

entries:
  - name: support
    kind: library.lua
    source: file://support.lua
    modules: [http, json]
    imports:
      http_errors: kickside.contract:http_errors

  - name: get_journal
    kind: function.lua
    source: file://get_journal.lua
    method: handler
    imports: { http_errors: kickside.contract:http_errors, queries: chestor.journal.read:queries, support: chestor.journal.api:support }
  - name: get_journal.endpoint
    kind: http.endpoint
    meta:
      comment: Journal snapshot; every collection it carries is a keyset page continued through these parameters.
      query:
        - limit
        - before_seq
        - task_limit
        - task_after_sort_order
        - task_after_updated_at
        - task_after_id
        - artifact_limit
        - artifact_after_created_at
        - artifact_after_id
        - graph_limit
        - graph_after_rank
        - graph_after_updated_at
        - graph_after_id
        - cursor_limit
        - cursor_after_updated_at
        - cursor_after_id
        - span_limit
        - span_after_activity_at
        - span_after_id
        - work_limit
    method: GET
    func: get_journal
    path: /workspace/journals/{id}

  - name: get_health
    kind: function.lua
    source: file://get_health.lua
    method: handler
    imports: { http_errors: kickside.contract:http_errors, queries: chestor.journal.read:queries, support: chestor.journal.api:support }
  - name: get_health.endpoint
