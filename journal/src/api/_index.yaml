  - name: transitions
    kind: library.lua
    meta:
      comment: HTTP adapter over the guarded transition commands; addresses one task or a bounded batch and answers per-task results.
    source: file://transitions.lua
    imports:
      http_errors: kickside.contract:http_errors
      commands: chestor.journal.write:commands
      thread_log: chestor.journal:thread_log

  - name: transition_task
    kind: function.lua
    source: file://transition_task.lua
    method: handler
    imports: { http_errors: kickside.contract:http_errors, transitions: chestor.journal.api:transitions, support: chestor.journal.api:support }
  - name: transition_task.endpoint
    kind: http.endpoint
    meta:
      comment: >-
        Moves task state over HTTP through the same guarded commands the ActOnJournal verbs run.
        Body carries action plus the verb's payload (reason, result, outcome, distilled, decision_id,
        receipt_id, waiver, principal, lease_id, fencing_token, expected_revision, command_id), and
        tasks names a bounded batch that answers one result per task.
      actions: [block, cancel, close, complete, fold, gate_pass, reopen, start, unblock]
      max_batch: 50
    method: POST
    func: transition_task
    path: /workspace/journals/{id}/tasks/{task_id}/transition

