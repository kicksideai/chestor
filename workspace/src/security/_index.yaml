version: '1.0'
namespace: chestor.workspace.security
entries:
- name: member_access
  kind: security.policy
  groups: []
  policy:
    resources:
    - chestor.workspace.traits:*
    - chestor.workspace:entry_create_view
    - chestor.workspace:nav_item
    - chestor.workspace:workspace_view
    actions: access
    effect: allow
- name: member_discovery
  kind: security.policy
  groups: []
  policy:
    resources:
    - chestor.workspace:*
    - chestor.workspace.*
    actions:
    - registry.get
    - registry.find
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    comment: Application role with access to the component reading surface and endpoints.
  targets:
  - entry: chestor.workspace.security:member_access
    path: .groups +=
  - entry: chestor.workspace.security:member_discovery
    path: .groups +=
  - entry: chestor.workspace.security:module_access
    path: .groups +=
