version: '1.0'
namespace: chestor.db_schema.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Db Schema
    surface: chestor.db_schema
    intent: module_access
    includes:
    - chestor.db_schema.security:member_access
    - chestor.db_schema.security:member_discovery
  groups: []
  policy:
    resources:
    - chestor.db_schema.api:apply_schema.endpoint
    - chestor.db_schema.api:get_schema.endpoint
    - chestor.db_schema.api:list_indexes.endpoint
    - chestor.db_schema.api:list_relations.endpoint
    - chestor.db_schema.api:list_tables.endpoint
    actions: access
    effect: allow
- name: module_tools
  kind: security.policy
  meta:
    title: Db Schema tools
    surface: chestor.db_schema
    intent: tool_access
  groups: []
  policy:
    resources:
    - chestor.db_schema.traits:edit_schema_tool
    - chestor.db_schema.traits:get_schema_tool
    actions:
    - funcs.call
    - funcs.security
    effect: allow
