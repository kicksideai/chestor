version: "1.0"
namespace: chestor.db_schema.traits

# Agent trait contributed by the db-schema module: lets an agent inspect and model
# a database-schema workspace entry through the SAME canonical event-sourced flow
# the renderer uses (typed commands -> thread events -> projection read model). The
# agents module discovers it via meta.type agent.trait.

entries:
  - name: schema_model
    kind: registry.entry
    meta:
      type: agent.trait
      title: Model Database Schema
      public: true
      icon: tabler:database
      comment: Read and edit a database-schema entry (tables, columns, relations) via typed commands.
      tags: [database, schema, modeling, erd]
    prompt: |
      You can inspect and model a database schema with the GetDatabaseSchema and
      EditDatabaseSchema tools. Both take the schema entry's `entry_id`.
      - GetDatabaseSchema returns the current tables, columns and relations.
      - EditDatabaseSchema applies a batch of typed commands; each is { type, body }.
        Command type values must be canonical `chestor.db_schema.events:*`
        event types: `chestor.db_schema.events:table.added` {id,name,description?},
        `chestor.db_schema.events:table.updated` {id,name?,description?},
        `chestor.db_schema.events:table.removed` {id};
        `chestor.db_schema.events:column.added` {id,table_id,name,col_type,primary_key?,nullable?},
        `chestor.db_schema.events:column.updated` {id,...},
        `chestor.db_schema.events:column.removed` {id};
        `chestor.db_schema.events:relation.added` {id,from_table_id,to_table_id,relation_type},
        `chestor.db_schema.events:relation.updated` {id,name?,relation_type?},
        `chestor.db_schema.events:relation.removed` {id};
        `chestor.db_schema.events:layout.position-set` {table_id,x,y}.
        Generate ids as UUIDs. Column types are one of TEXT, INTEGER, BIGINT,
        BOOLEAN, NUMERIC, TIMESTAMP, UUID, JSONB.
      Read the schema first, then apply a minimal set of commands. Changes are
      event-sourced and show live in the schema's graph view.
    tools:
      - chestor.db_schema.traits:get_schema_tool
      - chestor.db_schema.traits:edit_schema_tool

  - name: get_schema_tool
    kind: function.lua
    meta:
      type: tool
      title: Get Database Schema
      mcp:
        required_scopes:
          - state.read
      llm_alias: GetDatabaseSchema
      llm_description: Read a database-schema entry's tables, columns and relations. Input { entry_id }.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "entry_id": { "type": "string", "description": "The database-schema workspace entry id" }
          },
          "required": ["entry_id"]
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "success": { "type": "boolean" },
            "schema": { "type": "object" },
            "error": { "type": "string" }
          },
          "required": ["success"]
        }
    source: file://get_schema.lua
    method: handle
    imports:
      schema_state: chestor.db_schema:schema_state

  - name: edit_schema_tool
    kind: function.lua
    meta:
      type: tool
      title: Edit Database Schema
      mcp:
        required_scopes:
          - state.read
          - state.write
      llm_alias: EditDatabaseSchema
      llm_description: "Apply typed schema commands (add/update/remove tables, columns, relations; set layout) to a database-schema entry. Input { entry_id, commands: [{ type, body }] }. Returns the updated schema."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "entry_id": { "type": "string", "description": "The database-schema workspace entry id" },
            "commands": {
              "type": "array",
              "description": "Typed commands, each { type, body }",
              "items": {
                "type": "object",
                "properties": {
                  "type": { "type": "string" },
                  "body": { "type": "object" }
                },
                "required": ["type", "body"]
              }
            }
          },
          "required": ["entry_id", "commands"]
        }
      output_schema: |
        {
          "type": "object",
          "properties": {
            "success": { "type": "boolean" },
            "schema": { "type": "object" },
            "error": { "type": "string" }
          },
          "required": ["success"]
        }
    source: file://edit_schema.lua
    method: handle
    imports:
      schema_state: chestor.db_schema:schema_state
