organization: chestor
module: db-schema
type: plugin
description: Event-sourced database-schema component (tables, columns, relations, indexes, and layout) that plugs into chestor/workspace by declaration.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/chestor
homepage: https://wippy.ai
keywords:
  - kickside
  - chestor
  - workspace
  - db-schema
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
embed:
  - chestor.db_schema:ui_fs
exclude:
  - "wippy.lock"
  - ".wippy/**"
  - "app:**"
  - "app.env:**"
  - "ui/node_modules/**"
  - "ui/node_modules:**"
  - "test/**"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
